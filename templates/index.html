<html lang="en">
   <head>
      <meta charset="UTF-8">
      <title> Electricity Bill Estimator</title>
      <link rel="stylesheet" href="/static/style.css">
   </head>
   <body>
      <h1>Electricity Bill Estimator Estimator</h1>
      <p>Enter the number of units consumed to estimate your electricity bill.</p>
      <form action="/calculate" method="POST">
         <label>🔌 Units Consumed:</label>
         <input type="number" name="units" placeholder="Enter units consumed" required>
         <button type="submit">Calculate 💡</button>
      </form>
      {% if bill %}
      <div class="result">
         <h2>Units Used: {{ units }} kWh</h2>
         <h2>Total Bill: $ {{ bill }}</h2>
         <p> {{ message}}</p>
      </div>
      {% endif %}
   </body>
</html>
